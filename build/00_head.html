<!-- Lo que el navegador tiene PROHIBIDO hacer con tus datos.
     No es una promesa del codigo: es el navegador quien lo impide. La unica
     salida permitida es Microsoft, y solo si pulsas conectar. Cualquier otra
     cosa -una imagen, una fuente, un formulario, un fetch a donde sea- queda
     bloqueada y avisa por consola. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com; form-action 'none'; base-uri 'none'">
<title>Inventario de Aplicaciones</title>
<meta name="description" content="Plataforma de gestion de software e inventario Intune: cumplimiento, control de versiones, informes para cliente y tendencias. Procesa Excel/CSV localmente en el navegador.">

     Eran la unica peticion que la pagina hacia sola, sin pulsar nada. -->
